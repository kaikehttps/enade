<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acervo ENADE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f6f0;color:#152f30;font:17px system-ui}header{background:#153c3b;color:white;padding:19px max(5vw,22px);display:flex;align-items:center;justify-content:space-between}header strong{letter-spacing:.03em}main{max-width:1040px;margin:52px auto;padding:0 22px}h1{font:normal clamp(36px,6vw,63px) Georgia;margin:0 0 20px}h2{font-size:20px}button,input,select{font:inherit;padding:9px 13px;border-radius:6px;border:1px solid #a2b4ac}button{cursor:pointer;background:#21524b;color:white}input,select{background:white;max-width:100%}form,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}article{background:white;border:1px solid #d4dcd4;padding:20px 24px;margin:12px 0;border-radius:9px}small,summary{color:#496661}summary{cursor:pointer}mark{background:#ffecab}#msg{color:#823c23;font-weight:600}#term{flex:1}details{margin:14px 0}pre{white-space:pre-wrap}a{color:#164d44}[hidden]{display:none!important}#account{font-size:14px}label{display:grid;font-size:.85em;gap:3px}</style>
<header><strong>Acervo ENADE</strong><span id="account">Pesquisa de questões</span></header><main>
<section id="entry"><h1>Entrar no acervo</h1><form id="login"><label>Usuário<input id="user" required autocomplete="username"></label><label>Senha<input type="password" id="pass" required autocomplete="current-password"></label><button>Entrar</button></form></section>
<section id="work" hidden><h1>Consultar questões</h1><form id="find"><input id="term" aria-label="Termo de busca" placeholder="Buscar um tema ou conceito"><button>Buscar</button></form><details><summary>Filtros</summary><form id="filters"></form></details><div class="row"><button id="list">Minha lista</button><button id="analytics" hidden>Análises</button><button id="exporter" hidden>Exportar JSON</button><button id="exit">Sair</button></div><p id="status"></p><section id="results"></section><div class="row"><button id="prev">Anterior</button><button id="next">Próxima</button></div></section><p role="status" id="msg"></p></main>
<script src="/vendor/purify.min.js"></script><script src="/vendor/marked.umd.js"></script><script src="/vendor/mermaid.min.js"></script><link rel="stylesheet" href="/vendor/katex.min.css"><script src="/vendor/katex.min.js"></script>
<script>
const $=id=>document.getElementById(id);let page=1,perfil='',listMode=false;
const el=(tag,txt)=>{const n=document.createElement(tag);n.textContent=txt;return n};
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!r.ok){let d=await r.json();throw Error(r.status+' · '+d.detail)}return r}
function guard(fn){return async e=>{e?.preventDefault();$('msg').textContent='';try{await fn()}catch(err){$('msg').textContent=err.message}}}
for(let [key,name] of Object.entries({area:'Área',curso:'Curso',ano:'Ano',tipo:'Tipo de questão',componente:'FG ou CE',competencia:'Competência'})){let label=el('label',name),input=el('input','');input.name=key;label.append(input);$('filters').append(label)}
async function enter(u){perfil=u.perfil;$('entry').hidden=true;$('work').hidden=false;$('account').textContent=u.usuario+' · '+u.perfil;$('analytics').hidden=$('exporter').hidden=perfil!=='professor';await search()}
$('login').onsubmit=guard(async()=>{let r=await api('/api/login','POST',{usuario:$('user').value,senha:$('pass').value});$('pass').value='';await enter(await r.json())});
async function media(node,m){let p=el('pre',m.conteudo);node.append(p);if(m.formato==='latex'&&window.katex)katex.render(m.conteudo,p,{throwOnError:false,trust:false});if(m.formato==='mermaid'&&window.mermaid){mermaid.initialize({startOnLoad:false,securityLevel:'strict'});p.className='mermaid';await mermaid.run({nodes:[p]})}if(m.formato==='markdown'&&window.marked&&window.DOMPurify)p.innerHTML=DOMPurify.sanitize(marked.parse(m.conteudo))}
async function search(){listMode=false;const params=new URLSearchParams({q:$('term').value,pagina:page});for(let [k,v] of new FormData($('filters')))if(v)params.set(k,v);let r=await api('/api/busca?'+params),d=await r.json();$('status').textContent=d.total+' questões · página '+page+' · cache '+r.headers.get('X-Cache');$('results').replaceChildren();$('prev').disabled=page===1;$('next').disabled=page*10>=d.total;
for(const h of d.itens){let card=el('article','');card.append(el('small',h.curso+' · '+h.ano+' · '+h.componente+' · '+h.tipo),el('h2','Questão '+h.numero+(h.anulada?' · Anulada':'')));if(h.texto_base)card.append(el('p',h.texto_base));let p=el('p','');for(let s of (h.trecho||h.enunciado).split(/(⟦.*?⟧)/g))p.append(s.startsWith('⟦')?el('mark',s.slice(1,-1)):document.createTextNode(s));card.append(p);if(h.trecho&&h.trecho.replace(/[⟦⟧]/g,'')!==h.enunciado)card.append(el('p',h.enunciado));for(let [k,v] of Object.entries(h.alternativas))card.append(el('div',k+') '+v));for(let m of h.midia)await media(card,m);if('gabarito'in h)card.append(el('p','Gabarito: '+(h.gabarito||'—')));card.append(el('p',h.pdf+' · p. '+h.pagina+'–'+h.pagina_final));let b=el('button','Adicionar à lista');b.onclick=guard(async()=>{await api('/api/lista/'+h.id,'PUT');b.textContent='Adicionada'});card.append(b);$('results').append(card)}}
$('find').onsubmit=$('filters').onsubmit=guard(async()=>{page=1;await search()});$('prev').onclick=guard(async()=>{page--;await search()});$('next').onclick=guard(async()=>{page++;await search()});
async function lista(){let ids=await(await api('/api/lista')).json();$('results').replaceChildren();$('status').textContent='Minha lista · '+ids.length+' questões';$('next').disabled=$('prev').disabled=true;for(let id of ids){let d=await(await api('/api/item/'+id)).json();let a=el('article','');a.append(el('h2',d.curso+' · questão '+d.numero),el('p',d.enunciado));let b=el('button','Remover');b.onclick=guard(async()=>{await api('/api/lista/'+id,'DELETE');await lista()});a.append(b);$('results').append(a)}}
$('list').onclick=guard(lista);$('analytics').onclick=guard(async()=>{let d=await(await api('/api/analises')).json();$('results').replaceChildren();$('status').textContent='Distribuição por curso e competência';for(let [c,n] of Object.entries(d.cursos))$('results').append(el('article',c+' · '+n+' questões'));for(let x of d.competencias)$('results').append(el('div',x.ano+' · '+x.competencia+' · '+x.total));$('next').disabled=$('prev').disabled=true});
$('exporter').onclick=guard(async()=>{let r=await api('/api/exportar');let url=URL.createObjectURL(await r.blob());let a=document.createElement('a');a.href=url;a.download='simulado.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)});
$('exit').onclick=guard(async()=>{await api('/api/sair','POST');location.reload()});api('/api/eu').then(r=>r.json()).then(enter).catch(()=>{});
</script></html>
