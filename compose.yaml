name: enade
x-app: &app
  build: .
  image: enade-lab:local
  restart: on-failure
services:
  kdc:
    <<: *app
    hostname: kdc
    command: [sh, infra/kdc.sh]
    volumes: ["./segredos:/keys","kdcdb:/var/lib/krb5kdc","kdcconf:/etc/krb5kdc"]
    healthcheck:
      test: ["CMD-SHELL","test -e /keys/ready && test $$(cat /proc/1/comm) = krb5kdc"]
      interval: 5s
      timeout: 4s
      retries: 40
  ldap:
    <<: *app
    hostname: ldap
    depends_on: {kdc: {condition: service_healthy}}
    command: [sh, infra/ldap.sh]
    volumes: ["./segredos/ldap:/run/cred:ro","ldapdb:/var/lib/enade-ldap"]
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    depends_on: {kdc: {condition: service_healthy}}
    entrypoint: [bash, /scripts/kafka.sh]
    restart: on-failure
    volumes: ["./infra:/scripts:ro","./infra/krb5.conf:/etc/krb5.conf:ro","./segredos/kafka:/run/cred:ro","kafkadb:/var/lib/kafka/data"]
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    hostname: elastic
    depends_on: {kdc: {condition: service_healthy}}
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      ELASTIC_PASSWORD_FILE: /usr/share/elasticsearch/config/cred/bootstrap
      xpack.license.self_generated.type: trial
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: cred/tls.key
      xpack.security.http.ssl.certificate: cred/tls.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: cred/tls.key
      xpack.security.transport.ssl.certificate: cred/tls.crt
      xpack.security.transport.ssl.certificate_authorities: cred/ca.crt
      xpack.security.authc.realms.kerberos.krb.order: 0
      xpack.security.authc.realms.kerberos.krb.keytab.path: cred/service.keytab
      xpack.security.authc.realms.kerberos.krb.remove_realm_name: "false"
    volumes: ["./infra/krb5.conf:/etc/krb5.conf:ro","./segredos/elastic:/usr/share/elasticsearch/config/cred:ro","elasticdb:/usr/share/elasticsearch/data"]
  redis:
    image: redis:7.4-alpine
    depends_on: {kdc: {condition: service_healthy}}
    entrypoint: [sh,-c,'exec redis-server --appendonly yes --requirepass "$$(cat /run/cred/redis)"']
    volumes: ["redisdb:/data","./segredos/redis:/run/cred:ro"]
  setup:
    <<: *app
    command: [python,-m,infra.init]
    depends_on: [elastic]
    volumes: ["./segredos/admin:/run/cred:ro"]
  topics:
    <<: *app
    command: [sh,infra/ticket.sh,produtor/producer,python,-m,infra.topics]
    depends_on: [kafka]
    volumes: ["./segredos/producer:/run/cred:ro"]
  api:
    <<: *app
    depends_on: {setup: {condition: service_completed_successfully}, ldap: {condition: service_started}, redis: {condition: service_started}}
    command: [sh,infra/ticket.sh,api/api,uvicorn,app.api:app,--host,0.0.0.0,--port,"8443",--ssl-certfile,/run/cred/tls.crt,--ssl-keyfile,/run/cred/tls.key]
    ports: ["127.0.0.1:8443:8443"]
    volumes: ["./segredos/api:/run/cred:ro"]
  worker:
    <<: *app
    depends_on: {topics: {condition: service_completed_successfully},setup: {condition: service_completed_successfully},redis: {condition: service_started}}
    command: [sh,infra/ticket.sh,indexador/worker,python,-m,app.worker]
    volumes: ["./segredos/worker:/run/cred:ro"]
  produtor:
    <<: *app
    restart: "no"
    depends_on: {topics: {condition: service_completed_successfully}}
    command: [sh,infra/ticket.sh,produtor/producer,python,-m,app.worker,/dados/questoes.jsonl]
    volumes: ["./segredos/producer:/run/cred:ro","./amostras:/dados:ro"]
volumes:
  kdcdb: {}
  kdcconf: {}
  ldapdb: {}
  kafkadb: {}
  elasticdb: {}
  redisdb: {}

